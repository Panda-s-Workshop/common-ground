name: Label issues
on:
  issues:
    types: [ opened ]

# the issue forms ask which part of the mod is affected; this turns the answer into an area label
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // an issue form's answer is the paragraph under its "### Label" heading
            const answer = (heading) => {
              const match = body.match(new RegExp('^### ' + heading + '[^\\n]*\\n+([^\\n]+)', 'm'));
              return match ? match[1].trim() : null;
            };
            const areas = {
              'Mobs missing or too many in a biome': 'area: spawns',
              'A preset (a biome mod's mappings)': 'area: presets',
              'Mapping lines and the config file': 'area: config',
              'The best guess for unmapped biomes': 'area: guess',
              'Biome tags (variants, other mods' biome checks)': 'area: tags',
              'The /commonground command and the start summary': 'area: command',
            };
            const labels = [areas[answer('Area')]].filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels });
            }
