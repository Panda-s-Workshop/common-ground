body:
  - type: markdown
    attributes:
      value: |
        Ask whether mods work together, share setups that work, or get help putting Common Ground in a modpack (biome mods without a preset, mob mods that still miss a biome, servers). When a reply answers it, mark it as the answer so others can find it.

        If something is broken with another mod, [report a conflict with another mod](https://github.com/Panda-s-Workshop/common-ground/issues/new?template=3-mod-conflict.yml) instead.

  - type: textarea
    id: topic
    attributes:
      label: Your question or finding
      placeholder: Does it have a preset for my biome mod?
    validations:
      required: true

  - type: input
    id: mods
    attributes:
      label: The mods, datapacks or modpack involved
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Common Ground version
      placeholder: 0.1.0
    validations:
      required: false
