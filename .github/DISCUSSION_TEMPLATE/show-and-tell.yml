body:
  - type: markdown
    attributes:
      value: |
        Share your mappings and modpacks: preset tables for biome mods we don't cover yet, packs that run Common Ground, and mob mods that now spawn everywhere.

  - type: textarea
    id: show
    attributes:
      label: What you'd like to share
      description: Drag screenshots straight into this box.
    validations:
      required: true

  - type: input
    id: seed
    attributes:
      label: Seed and coordinates
      placeholder: The pack's biome mods and mob mods, and the lines you added
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Common Ground version
      placeholder: 0.1.0
    validations:
      required: false
